# CrossFire PRO procedures site.
# Blowfish v3.9.0 is a Hugo module (see config/_default/module.toml and go.mod).
# Published at https://b-lindsey.github.io/crossfire-pro/ from docs/crossfire-pro/.
baseURL = "https://b-lindsey.github.io/crossfire-pro/"
defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 30
buildDrafts = false
buildFuture = false
titleCaseStyle = "none"
relativeURLs = false

[pagination]
  pagerSize = 100

[taxonomies]
  tag = "tags"
  series = "series"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[frontmatter]
  lastmod = ["lastmod", ":fileModTime", ":default"]
